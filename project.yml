name: Notetaker
options:
  bundleIdPrefix: com.aritradebnath
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  HotKey:
    url: https://github.com/soffes/HotKey
    from: 0.2.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Notetaker:
    type: application
    platform: macOS
    sources:
      - path: Notetaker
        excludes:
          - "Resources/Models/**"
          - "Resources/bin/**"
    resources:
      - path: Notetaker/Resources/Models
        optional: true
    postCompileScripts:
      - name: Copy yt-dlp + ffmpeg binaries
        script: |
          set -e
          BIN_SRC="${SRCROOT}/Notetaker/Resources/bin"
          BIN_DST="${TARGET_BUILD_DIR}/${PRODUCT_NAME}.app/Contents/Resources/bin"
          mkdir -p "$BIN_DST"
          cp -f "$BIN_SRC/yt-dlp"  "$BIN_DST/yt-dlp"
          cp -f "$BIN_SRC/ffmpeg"  "$BIN_DST/ffmpeg"
          chmod +x "$BIN_DST/yt-dlp" "$BIN_DST/ffmpeg"
        inputFiles:
          - $(SRCROOT)/Notetaker/Resources/bin/yt-dlp
          - $(SRCROOT)/Notetaker/Resources/bin/ffmpeg
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(PRODUCT_NAME).app/Contents/Resources/bin/yt-dlp
          - $(TARGET_BUILD_DIR)/$(PRODUCT_NAME).app/Contents/Resources/bin/ffmpeg
    dependencies:
      - package: GRDB
      - package: HotKey
    info:
      path: Notetaker/Resources/Info.plist
      properties:
        CFBundleDisplayName: Notetaker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Notetaker transcribes your voice offline to create notes. Audio never leaves your Mac."
        NSHumanReadableCopyright: "Copyright © 2026 Aritra Debnath."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aritradebnath.notetaker
        PRODUCT_NAME: Notetaker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  NotetakerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotetakerTests
    dependencies:
      - target: Notetaker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aritradebnath.notetakertests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notetaker.app/Contents/MacOS/Notetaker"

schemes:
  Notetaker:
    build:
      targets:
        Notetaker: all
        NotetakerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotetakerTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
